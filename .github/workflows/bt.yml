name: bt
# OpenPocket Bass: the Bluetooth audio work (branch bt): what JieLi's classic stack costs, then the test image
on:
  push:
    branches: [bt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The AC79 SDK's libraries at the commit third_party/jieli-ble pins (JieLi's gitee repository, Apache-2.0)
        run: |
          set -x
          mkdir -p build/sdk && cd build/sdk && git init -q && git remote add origin https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git
          git config core.sparseCheckout true
          printf '/cpu/wl82/liba/*.a\n/LICENSE\n' > .git/info/sparse-checkout
          git fetch --filter=blob:none --depth 1 origin 0617f4cc09685332aaf1104893718291c54ee5bb || git fetch --filter=blob:none origin release/AC79NN_SDK_V1.2.0
          git checkout -q 0617f4cc09685332aaf1104893718291c54ee5bb
          sha256sum cpu/wl82/liba/btctrler.a cpu/wl82/liba/btstack.a cpu/wl82/liba/cpu.a cpu/wl82/liba/lib_ccm_aes.a
          ls cpu/wl82/liba
      - uses: actions/upload-artifact@v4
        with:
          name: jieli-sdk-liba
          path: |
            build/sdk/cpu/wl82/liba/btstack.a
            build/sdk/cpu/wl82/liba/btctrler.a
            build/sdk/cpu/wl82/liba/audio_server.a
            build/sdk/cpu/wl82/liba/cpu.a
            build/sdk/cpu/wl82/liba/lib_sbc_eng.a
            build/sdk/cpu/wl82/liba/crypto_toolbox_Osize.a
            build/sdk/cpu/wl82/liba/lib_ccm_aes.a
            build/sdk/cpu/wl82/liba/wl_rf_common.a
            build/sdk/LICENSE
      - name: Build the container
        run: docker build --platform linux/amd64 -t opb .
      - name: The BLE test image (baseline)
        run: docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src -e OP_BLE=1 opb sh firmware/build.sh 2>&1 | tail -40
      - name: Probe the classic stack's size
        run: docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src -e SDK=/src/build/sdk opb sh tools/bt/probe.sh
  sdk-branch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch
        run: |
          if git ls-remote --exit-code https://github.com/${{ github.repository }}.git refs/heads/bt-sdk >/dev/null; then echo "bt-sdk exists"; exit 0; fi
          touch /tmp/need
          mkdir sdk && cd sdk && git init -q && git remote add origin https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git
          git config core.sparseCheckout true
          printf '/cpu/wl82/liba/*.a\n/LICENSE\n/include_lib/btstack/\n/include_lib/btctrler/\n/include_lib/media/\n/apps/common/config/\n' > .git/info/sparse-checkout
          git fetch -q --filter=blob:none --depth 1 origin 0617f4cc09685332aaf1104893718291c54ee5bb
          git checkout -q 0617f4cc09685332aaf1104893718291c54ee5bb
          echo "d98f2ad9d483cd2c103cab56c2760162edf92cc451a04e5668af02a590c95cb3  cpu/wl82/liba/btctrler.a" | sha256sum -c
      - name: Push to bt-sdk
        run: |
          [ -f /tmp/need ] || exit 0
          mkdir out && cd out && git init -q -b bt-sdk
          mkdir -p liba && cp ../sdk/cpu/wl82/liba/btstack.a ../sdk/cpu/wl82/liba/btctrler.a ../sdk/cpu/wl82/liba/audio_server.a ../sdk/cpu/wl82/liba/cpu.a ../sdk/cpu/wl82/liba/lib_sbc_eng.a ../sdk/cpu/wl82/liba/crypto_toolbox_Osize.a ../sdk/cpu/wl82/liba/lib_ccm_aes.a ../sdk/cpu/wl82/liba/wl_rf_common.a liba/ 2>&1 || true
          cp -r ../sdk/include_lib ../sdk/apps . ; cp ../sdk/LICENSE LICENSE-JieLi-Apache-2.0
          echo "JieLi fw-AC79_AIoT_SDK at 0617f4cc09685332aaf1104893718291c54ee5bb (gitee), unchanged: libraries, headers, config. Apache-2.0." > README.md
          sha256sum liba/* >> README.md
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "AC79 SDK at 0617f4cc (gitee): the Bluetooth libraries"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bt-sdk
