name: build
on:
  pull_request:
  push:
    branches: [main, bass]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the container, the firmware and the installer packages
        run: node tools/op.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: openpocket-build
          path: |
            firmware/openpocket.bin
            docs/firmware/*.fwsc
            docs/firmware/manifest.json
            build/SHA256SUMS
      # OpenPocket Bass: the Bluetooth audio test image, offered only through the installer's ?channel=bt-test link
      - name: Build the Bluetooth audio test channel (never the installer default)
        run: node tools/op.mjs package-bt
      # OpenPocket Bass: the installer and the editor (docs/) with this build's packages, for GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/bass' || github.ref == 'refs/heads/main'
        with:
          path: docs
      - name: Build the MIDI test channel package (never the installer default)
        run: node tools/op.mjs package-test
      - uses: actions/upload-artifact@v4
        with:
          name: openpocket-midi-test
          path: |
            firmware/openpocket-midi-test.bin
            docs/firmware/midi-test/
            build/SHA256SUMS-midi-test
      - name: Host tests
        run: node tools/op.mjs test
  pages:
    # OpenPocket Bass: publishes the installer with this build on https://<owner>.github.io/openpocket/
    # (Settings > Pages > Source: GitHub Actions, once)
    if: github.ref == 'refs/heads/bass' || github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
